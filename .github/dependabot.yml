version: 2
updates:
  # Rust workspace. arkworks crates are version-locked siblings, so group them
  # into one PR instead of N racing PRs.
  - package-ecosystem: cargo
    directory: /zkwrap-rs
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      arkworks:
        patterns:
          - "ark-*"
    ignore:
      # zkwrap-sp1 must stay on ark 0.5: sp1-verifier's `ark` feature exposes
      # ark 0.5 types (still ^0.5 as of sp1-verifier 6.3.1).
      # Patch updates stay enabled; revisit when sp1-verifier moves to ark 0.6.
      - dependency-name: "ark-*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # Go module (gnark, gnark-crypto, ...).
  - package-ecosystem: gomod
    directory: /zkwrap-gnark
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # gnark and gnark-crypto are released in lockstep — a given gnark version
      # only builds against its matching gnark-crypto line (e.g. gnark v0.14
      # needs gnark-crypto v0.19.x). Group them so Dependabot proposes the pair
      # together, never gnark-crypto alone (which can't build against the pinned
      # gnark).
      gnark:
        patterns:
          - "github.com/consensys/gnark"
          - "github.com/consensys/gnark-crypto"

  # Action versions pinned in .github/workflows/*.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
